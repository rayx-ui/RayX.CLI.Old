[package]
name = "rayx_demo"
version = "0.1.0"
edition = "2024"

[package.metadata.rayx]
app_name = "demo"
android_application_id = "dev.example.demo"
ios_project = "Demo.xcodeproj"
ios_scheme = "Demo"
ios_bundle_id = "dev.example.demo"
entry_dependencies = ["ui_runtime", "inspector"]

[features]
default = ["profile-all"]
profile-all = ["profile-a", "profile-b"]
profile-a = []
profile-b = []
inspect = ["dep:inspector"]
store = ["dep:store_backend"]

[dependencies]
ui_runtime = { path = "../../crates/ui_runtime" }
inspector = { path = "../../crates/inspector", optional = true }
demo_components = { path = "../../crates/demo_components" }
demo-fonts = { path = "../../crates/demo_fonts" }
store_backend = { version = "0.1", optional = true }
